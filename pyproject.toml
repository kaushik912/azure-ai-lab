[project]
name = "azure-ai-lab"
version = "0.1.0"
description = "Enterprise RAG & agentic gateway on Azure (FastAPI + LangGraph + Azure AI Search + AKS)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "openai>=1.40",
  "azure-identity>=1.17",
  "aiohttp>=3.9",
  "azure-search-documents>=11.6.0b4",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "azure-monitor-opentelemetry>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
