# Workload Identity: ServiceAccount annotated with a user-assigned managed identity client ID.
# That identity has: "Cognitive Services OpenAI User" on AOAI, "Search Index Data Reader" on AI Search.
# No API keys anywhere. Service is ClusterIP (private): test via `kubectl port-forward`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-app
  annotations:
    azure.workload.identity/client-id: "47a2c505-dda0-44f3-ad3e-4914d003fa2c"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-app }
  template:
    metadata:
      labels:
        app: ai-app
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ai-app
      containers:
        - name: api
          image: acrazureai18430.azurecr.io/azure-ai-lab:v1
          ports: [{ containerPort: 8000 }]
          env:
            - { name: AZURE_OPENAI_ENDPOINT, value: "https://aoai18430.openai.azure.com" }
            - { name: AZURE_OPENAI_CHAT_DEPLOYMENT, value: "chat" }
            - { name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT, value: "text-embedding-3-small" }
            - { name: AZURE_SEARCH_ENDPOINT, value: "https://srch18430.search.windows.net" }
            - { name: AZURE_SEARCH_INDEX, value: "docs" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-app
spec:
  type: ClusterIP
  selector: { app: ai-app }
  ports: [{ port: 80, targetPort: 8000 }]
