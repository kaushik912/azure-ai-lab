# TEMPLATE: do not `kubectl apply` this file directly. Render it first:
#   scripts/render-k8s.sh | kubectl apply -f -
# Placeholders (${...}) are filled from `terraform output` by scripts/render-k8s.sh.
#
# Workload Identity: ServiceAccount annotated with a user-assigned managed identity client ID.
# That identity has: "Cognitive Services OpenAI User" on AOAI, "Search Index Data Reader" on AI Search.
# No API keys anywhere. Service is ClusterIP (private): test via `kubectl port-forward`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-app
  annotations:
    azure.workload.identity/client-id: "${CLIENT_ID}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-app
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-app }
  template:
    metadata:
      labels:
        app: ai-app
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ai-app
      containers:
        - name: api
          image: ${ACR_LOGIN_SERVER}/azure-ai-lab:${IMAGE_TAG}
          ports: [{ containerPort: 8000 }]
          env:
            - { name: AZURE_OPENAI_ENDPOINT, value: "${AOAI_ENDPOINT}" }
            - { name: AZURE_OPENAI_CHAT_DEPLOYMENT, value: "chat" }
            - { name: AZURE_OPENAI_EMBEDDING_DEPLOYMENT, value: "text-embedding-3-small" }
            - { name: AZURE_SEARCH_ENDPOINT, value: "${SEARCH_ENDPOINT}" }
            - { name: AZURE_SEARCH_INDEX, value: "docs" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-app
spec:
  type: ClusterIP
  selector: { app: ai-app }
  ports: [{ port: 80, targetPort: 8000 }]
